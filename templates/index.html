<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RYDESAVYR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="home">
  <header>
    <h1>RYDESAVYR</h1>
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">
        {% for message in messages %}<p>{{ message }}</p>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" action="{{ url_for('results') }}" id="trip-form" class="trip-card">
    <div class="field">
      <label for="origin_address">From</label>
      <div class="row">
        <div class="autocomplete-wrap">
          <input type="text" id="origin_address" name="origin_address" autocomplete="off"
                 placeholder="e.g. Columbia University" value="{{ origin_address }}">
          <ul class="autocomplete-list" id="origin_address-list" hidden></ul>
        </div>
        <button type="button" id="use-location">Use my location</button>
      </div>
      <input type="hidden" id="origin_lat" name="origin_lat">
      <input type="hidden" id="origin_lng" name="origin_lng">
      <p id="location-status" class="location-badge"></p>
    </div>

    <div class="field">
      <label for="destination_address">To</label>
      <div class="autocomplete-wrap">
        <input type="text" id="destination_address" name="destination_address" autocomplete="off"
               placeholder="e.g. your home address" value="{{ destination_address }}">
        <ul class="autocomplete-list" id="destination_address-list" hidden></ul>
      </div>
      <input type="hidden" id="destination_lat" name="destination_lat">
      <input type="hidden" id="destination_lng" name="destination_lng">
    </div>

    <button type="submit">Find the best ryde</button>
  </form>

  <script>
    // A full form submit reloads the page, which would otherwise wipe the
    // hidden origin_lat/origin_lng fields and force clicking "Use my
    // location" (and re-triggering the browser's permission prompt) before
    // every single search. Caching the last successful reading in
    // localStorage lets repeat searches reuse it silently instead.
    var ORIGIN_LOCATION_CACHE_KEY = 'rydesavyr_origin_location';
    var ORIGIN_LOCATION_CACHE_MS = 20 * 60 * 1000; // 20 minutes

    function saveOriginLocationToCache(lat, lng) {
      try {
        localStorage.setItem(ORIGIN_LOCATION_CACHE_KEY, JSON.stringify({
          lat: lat, lng: lng, savedAt: Date.now(),
        }));
      } catch (e) { /* localStorage unavailable (e.g. private browsing) — no cache, no crash */ }
    }

    function loadFreshOriginLocationFromCache() {
      try {
        var raw = localStorage.getItem(ORIGIN_LOCATION_CACHE_KEY);
        if (!raw) return null;
        var cached = JSON.parse(raw);
        if (Date.now() - cached.savedAt > ORIGIN_LOCATION_CACHE_MS) {
          localStorage.removeItem(ORIGIN_LOCATION_CACHE_KEY);
          return null;
        }
        return cached;
      } catch (e) {
        return null;
      }
    }

    // Three highly visible cues all flip together whenever origin_lat/lng
    // are backed by geolocation rather than a typed/picked address: the
    // "Use my location" button itself, the From field's border + colored
    // placeholder, and a pill badge below it -- a small muted caption alone
    // was too easy to miss.
    function setLocationStatus(message, kind) {
      const status = document.getElementById('location-status');
      status.textContent = message;
      status.className = 'location-badge visible ' + kind;
    }

    function clearLocationStatus() {
      const status = document.getElementById('location-status');
      status.textContent = '';
      status.className = 'location-badge';
    }

    function setLocationActive(isActive) {
      document.getElementById('use-location').classList.toggle('location-active', isActive);
      document.getElementById('use-location').textContent = isActive ? '📍 Location set' : 'Use my location';
      document.getElementById('origin_address').classList.toggle('location-active', isActive);
    }

    function applyOriginLocation(lat, lng, statusMessage) {
      document.getElementById('origin_lat').value = lat;
      document.getElementById('origin_lng').value = lng;
      document.getElementById('origin_address').value = '';
      document.getElementById('origin_address').placeholder = 'Using your current location';
      setLocationActive(true);
      setLocationStatus(statusMessage, 'success');
    }

    document.getElementById('use-location').addEventListener('click', function () {
      if (!navigator.geolocation) {
        setLocationStatus('Geolocation is not supported by this browser.', 'error');
        return;
      }
      setLocationStatus('Locating…', 'pending');
      navigator.geolocation.getCurrentPosition(
        function (position) {
          saveOriginLocationToCache(position.coords.latitude, position.coords.longitude);
          applyOriginLocation(position.coords.latitude, position.coords.longitude, '📍 Using your current location');
        },
        function () {
          setLocationActive(false);
          setLocationStatus('Could not get your location — enter an address instead.', 'error');
        }
      );
    });

    // Typing a real address overrides geolocation -- drop the active state
    // so the button/field/badge don't keep claiming "current location" once
    // that's no longer true. (The lat/lng hidden fields are already cleared
    // by setupAutocomplete's own input handler below.)
    document.getElementById('origin_address').addEventListener('input', function () {
      setLocationActive(false);
      clearLocationStatus();
    });

    // On page load (including right after a search reloads the page),
    // silently reuse a still-fresh cached location instead of prompting
    // again — only if the user hasn't already typed/picked an address.
    (function () {
      if (document.getElementById('origin_address').value.trim() !== '') return;
      var cached = loadFreshOriginLocationFromCache();
      if (cached) applyOriginLocation(cached.lat, cached.lng, '📍 Using your last known location');
    })();

    function setupAutocomplete(inputId, latId, lngId) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(inputId + '-list');
      const latField = document.getElementById(latId);
      const lngField = document.getElementById(lngId);

      let debounceTimer = null;
      let requestSeq = 0;
      let activeIndex = -1;

      function closeList() {
        list.hidden = true;
        list.innerHTML = '';
        activeIndex = -1;
      }

      function selectSuggestion(suggestion) {
        input.value = suggestion.label;
        latField.value = suggestion.lat;
        lngField.value = suggestion.lon;
        closeList();
      }

      function renderSuggestions(suggestions) {
        list.innerHTML = '';
        if (suggestions.length === 0) {
          closeList();
          return;
        }
        suggestions.forEach(function (suggestion, i) {
          const item = document.createElement('li');
          item.textContent = suggestion.label;
          item.className = 'autocomplete-item';
          item.addEventListener('mousedown', function (e) {
            e.preventDefault();
            selectSuggestion(suggestion);
          });
          list.appendChild(item);
        });
        activeIndex = -1;
        list.hidden = false;
      }

      function highlight(index) {
        const items = list.querySelectorAll('.autocomplete-item');
        items.forEach(function (item, i) {
          item.classList.toggle('active', i === index);
        });
        if (index >= 0 && items[index]) {
          items[index].scrollIntoView({ block: 'nearest' });
        }
      }

      input.addEventListener('input', function () {
        latField.value = '';
        lngField.value = '';

        const query = input.value.trim();
        clearTimeout(debounceTimer);
        if (query.length < 3) {
          closeList();
          return;
        }

        debounceTimer = setTimeout(function () {
          const seq = ++requestSeq;
          fetch('/geocode/search?q=' + encodeURIComponent(query))
            .then(function (response) { return response.json(); })
            .then(function (suggestions) {
              if (seq === requestSeq) renderSuggestions(suggestions);
            })
            .catch(function () { closeList(); });
        }, 300);
      });

      input.addEventListener('keydown', function (e) {
        const items = list.querySelectorAll('.autocomplete-item');
        if (list.hidden || items.length === 0) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIndex = Math.min(activeIndex + 1, items.length - 1);
          highlight(activeIndex);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
          highlight(activeIndex);
        } else if (e.key === 'Enter' && activeIndex >= 0) {
          e.preventDefault();
          items[activeIndex].dispatchEvent(new MouseEvent('mousedown'));
        } else if (e.key === 'Escape') {
          closeList();
        }
      });

      input.addEventListener('blur', closeList);
    }

    setupAutocomplete('origin_address', 'origin_lat', 'origin_lng');
    setupAutocomplete('destination_address', 'destination_lat', 'destination_lng');
  </script>
</body>
</html>
